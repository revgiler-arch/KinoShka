name: Probe sources

# Проверка на настоящей сети: находит ли поиск фильмы у правообладателей.
on:
  push:
    branches: [probe]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew :app:testReleaseUnitTest --tests com.kinoshka.app.ProbeTest -i | grep "PROBE|" || true
