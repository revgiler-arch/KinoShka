name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Decrypt signing key
        env:
          SIGNING_KEY_PASS: ${{ secrets.SIGNING_KEY_PASS }}
        run: |
          if [ -z "$SIGNING_KEY_PASS" ]; then
            echo "::error::Нет секрета SIGNING_KEY_PASS (Settings → Secrets and variables → Actions)"; exit 1
          fi
          KEY_PASS=$(printf %s "$SIGNING_KEY_PASS" | tr -d '[:space:]'); export KEY_PASS
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in app/kinoshka.keystore.enc -out app/kinoshka.keystore -pass env:KEY_PASS
      - run: chmod +x gradlew && ./gradlew assembleRelease --stacktrace
      - run: cp app/build/outputs/apk/release/*.apk KinoShka.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KinoShka-apk
          path: KinoShka.apk
      # Готовый APK в разделе Releases: прямая ссылка, без zip
      - name: Read version
        run: echo "VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)" >> "$GITHUB_ENV"
      - name: Replace previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --cleanup-tag -y -R "$GITHUB_REPOSITORY" || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: КиноШка (последняя сборка)
          body: "versionCode: ${{ env.VERSION_CODE }}"
          files: KinoShka.apk
          make_latest: true
